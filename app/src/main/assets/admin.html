<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Harmber Admin - Command Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #1DB954;
            --bg-dark: #000000;
            --surface: #121212;
            --surface-hover: #181818;
            --text-main: #FFFFFF;
            --text-dim: #A7A7A7;
            --error: #E91429;
            --accent: #1ED760;
        }

        body {
            font-family: 'Circular', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 0;
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 { font-size: 42px; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 40px; display: flex; align-items: center; gap: 15px; }

        .section-card {
            background: var(--surface);
            padding: 32px;
            border-radius: 12px;
            margin-bottom: 24px;
            transition: background 0.3s;
        }

        .section-card h2 { margin-top: 0; font-size: 24px; font-weight: 700; margin-bottom: 24px; color: var(--primary); }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; font-size: 14px; text-transform: uppercase; color: var(--text-dim); }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #2A2A2A;
            border: 1px solid transparent;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            transition: all 0.2s;
            box-sizing: border-box;
            font-weight: 500;
        }

        input:focus, select:focus {
            outline: none;
            background: #333333;
            border-color: #555;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="color"] {
            width: 60px;
            height: 48px;
            border: none;
            border-radius: 4px;
            background: #2A2A2A;
            cursor: pointer;
            padding: 4px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: black;
            border: none;
            padding: 14px 32px;
            border-radius: 500px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        button:hover { background: #1fdf64; transform: scale(1.04); }
        button:active { transform: scale(0.98); }

        .btn-secondary { background: transparent; color: white; border: 1px solid #727272; }
        .btn-secondary:hover { border-color: white; background: transparent; }
        .btn-danger { background: #E91429; color: white; }

        .ad-list { margin-top: 60px; }
        .ad-item {
            background: var(--surface);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .ad-preview {
            width: 80px;
            height: 45px;
            background: #000;
            border-radius: 4px;
            object-fit: cover;
        }

        .ad-info { flex: 1; }
        .ad-info strong { display: block; font-size: 16px; margin-bottom: 2px; }
        .ad-info span { color: var(--text-dim); font-size: 13px; }

        .tag {
            background: var(--primary);
            color: black;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 2px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Harmber Command</h1>

        <div id="setup-view">
            <div class="section-card">
                <h2>Firebase Login</h2>
                <textarea id="fb-config" rows="8">{
  "apiKey": "AIzaSyApubO067JYW1ih6AUii86Nu0jC6WpFcVI",
  "authDomain": "harmber.firebaseapp.com",
  "databaseURL": "https://harmber-default-rtdb.firebaseio.com",
  "projectId": "harmber",
  "storageBucket": "harmber.firebasestorage.app",
  "messagingSenderId": "227933260927",
  "appId": "1:227933260927:android:0c101c91d898b86738034a"
}</textarea>
                <button onclick="initFirebase()" style="margin-top:24px">Authorize System</button>
            </div>
        </div>

        <div id="admin-view" style="display:none">
            <div class="section-card">
                <h2>Home UI & Seasonal Effects</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Brand Title Color</label>
                        <div class="color-picker-group">
                            <input type="color" id="homeTitleColorPicker" oninput="document.getElementById('homeTitleColor').value = this.value.toUpperCase()">
                            <input type="text" id="homeTitleColor" placeholder="#FFFFFF">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Seasonal Effect</label>
                        <select id="seasonalEffect">
                            <option value="none">None</option>
                            <option value="snow">Snow (Winter)</option>
                            <option value="rain">Rain (Atmospheric)</option>
                            <option value="hearts">Hearts (Neon)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Effect Duration (Sec)</label>
                        <input type="number" id="seasonalEffectDurationSeconds" value="10">
                    </div>

                    <div class="form-group">
                        <label>Banner Rotation (ms)</label>
                        <input type="number" id="swipeIntervalMs" value="5000">
                    </div>
                </div>

                <div class="form-group">
                    <label>Festival Icon/Banner URL</label>
                    <input type="text" id="festivalImageUrl" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Custom Falling Asset URL</label>
                    <input type="text" id="fallingEffectUrl" placeholder="https://...">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="autoSwipeEnabled">
                    <label for="autoSwipeEnabled">Enable Banner Auto-Swipe</label>
                </div>

                <button onclick="saveGlobalConfig()">Apply Global Changes</button>
            </div>

            <div class="section-card">
                <h2>Campaign Publisher</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Asset URL</label>
                        <input type="text" id="mediaUrl" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Placement</label>
                        <select id="adFormat">
                            <option value="banner">Home Carousel</option>
                            <option value="overlay">Player Artwork</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Headline</label>
                        <input type="text" id="title">
                    </div>
                    <div class="form-group">
                        <label>Sub-text</label>
                        <input type="text" id="subtitle">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Action URL</label>
                        <input type="text" id="actionUrl" placeholder="harmber://...">
                    </div>
                    <div class="form-group">
                        <label>Button Text</label>
                        <input type="text" id="buttonText" value="Listen Now">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Priority</label>
                        <input type="number" id="priority" value="0">
                    </div>
                    <div style="display: flex; gap: 24px; align-items: center; height: 100%;">
                        <div class="checkbox-group">
                            <input type="checkbox" id="active" checked>
                            <label for="active">Active</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="showAdTag" checked>
                            <label for="showAdTag">Show Tag</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="showButton" checked>
                            <label for="showButton">Show Button</label>
                        </div>
                    </div>
                </div>

                <button onclick="addAd()">Publish Campaign</button>
            </div>

            <div class="ad-list" id="ad-list">
                <!-- Campaigns loaded here -->
            </div>
        </div>
    </div>

    <script>
        let database;

        function initFirebase() {
            try {
                const config = JSON.parse(document.getElementById('fb-config').value);
                firebase.initializeApp(config);
                database = firebase.database();
                document.getElementById('setup-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                loadAds();
                loadGlobalConfig();
            } catch(e) { alert('Config error: ' + e.message); }
        }

        function loadGlobalConfig() {
            database.ref('ad_config').on('value', (snapshot) => {
                const config = snapshot.val();
                if (config) {
                    document.getElementById('autoSwipeEnabled').checked = config.autoSwipeEnabled !== false;
                    document.getElementById('swipeIntervalMs').value = config.swipeIntervalMs || 5000;
                    document.getElementById('seasonalEffect').value = config.seasonalEffect || 'none';
                    document.getElementById('seasonalEffectDurationSeconds').value = config.seasonalEffectDurationSeconds || 10;
                    document.getElementById('homeTitleColor').value = config.homeTitleColor || '#FFFFFF';
                    document.getElementById('homeTitleColorPicker').value = config.homeTitleColor || '#FFFFFF';
                    document.getElementById('festivalImageUrl').value = config.festivalImageUrl || '';
                    document.getElementById('fallingEffectUrl').value = config.fallingEffectUrl || '';
                }
            });
        }

        function saveGlobalConfig() {
            const config = {
                autoSwipeEnabled: document.getElementById('autoSwipeEnabled').checked,
                swipeIntervalMs: parseInt(document.getElementById('swipeIntervalMs').value) || 5000,
                seasonalEffect: document.getElementById('seasonalEffect').value,
                seasonalEffectDurationSeconds: parseInt(document.getElementById('seasonalEffectDurationSeconds').value) || 10,
                homeTitleColor: document.getElementById('homeTitleColor').value || '#FFFFFF',
                festivalImageUrl: document.getElementById('festivalImageUrl').value || '',
                fallingEffectUrl: document.getElementById('fallingEffectUrl').value || ''
            };
            database.ref('ad_config').update(config).then(() => alert('Synced!'));
        }

        function addAd() {
            const id = Date.now().toString();
            const ad = {
                id: id,
                mediaUrl: document.getElementById('mediaUrl').value,
                mediaType: 'image',
                adFormat: document.getElementById('adFormat').value,
                title: document.getElementById('title').value,
                subtitle: document.getElementById('subtitle').value,
                buttonText: document.getElementById('buttonText').value || 'Listen Now',
                actionUrl: document.getElementById('actionUrl').value,
                priority: parseInt(document.getElementById('priority').value) || 0,
                active: document.getElementById('active').checked,
                showAdTag: document.getElementById('showAdTag').checked,
                showButton: document.getElementById('showButton').checked,
                dailyLimit: 3, startHour: 0, endHour: 23
            };
            if (!ad.mediaUrl) return alert('Asset URL required');
            database.ref('banner_ads/' + id).set(ad).then(() => alert('Published!'));
        }

        function loadAds() {
            database.ref('banner_ads').on('value', (snapshot) => {
                const list = document.getElementById('ad-list');
                list.innerHTML = '<h2>Active Campaigns</h2>';
                const ads = snapshot.val();
                if (!ads) return;
                Object.values(ads).sort((a,b) => b.priority - a.priority).forEach(ad => {
                    const item = document.createElement('div');
                    item.className = 'ad-item';
                    item.innerHTML = `
                        <img src="${ad.mediaUrl}" class="ad-preview">
                        <div class="ad-info">
                            <strong>${ad.title || 'Untitled'} ${ad.active ? '<span class="tag">LIVE</span>' : ''}</strong>
                            <span>${ad.adFormat.toUpperCase()} • PRIORITY ${ad.priority}</span>
                        </div>
                        <div style="display:flex; gap:8px">
                            <button class="btn-secondary" onclick="toggleAd('${ad.id}', ${!ad.active})">${ad.active ? 'Pause' : 'Play'}</button>
                            <button class="btn-danger" onclick="deleteAd('${ad.id}')">Kill</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            });
        }

        function toggleAd(id, state) { database.ref('banner_ads/' + id).update({ active: state }); }
        function deleteAd(id) { if (confirm('Remove?')) database.ref('banner_ads/' + id).remove(); }
    </script>
</body>
</html>
